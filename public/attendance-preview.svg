<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Student Gate Attendance project preview</title>
  <desc id="desc">A school attendance dashboard showing RFID scan, location verification, record storage, and guardian notification.</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#dce9f8" stroke-width="1"/></pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#17233b" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="680" fill="url(#sky)"/>
  <rect width="1200" height="680" fill="url(#grid)" opacity=".75"/>
  <rect x="58" y="36" width="1084" height="66" rx="12" fill="#fff" opacity=".94"/>
  <circle cx="91" cy="69" r="15" fill="#156ff5"/><path d="M84 69l7 7 9-15" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="120" y="76" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#16233d">Student Gate Attendance</text>
  <text x="795" y="76" font-family="Arial,sans-serif" font-size="16" fill="#43516a">How it works</text><text x="932" y="76" font-family="Arial,sans-serif" font-size="16" fill="#43516a">Features</text><text x="1025" y="76" font-family="Arial,sans-serif" font-size="16" fill="#43516a">FAQ</text>
  <text x="72" y="218" font-family="Arial,sans-serif" font-size="59" font-weight="800" fill="#101b35">IoT Powered</text><text x="72" y="282" font-family="Arial,sans-serif" font-size="59" font-weight="800" fill="#101b35">Attendance with</text><text x="72" y="346" font-family="Arial,sans-serif" font-size="59" font-weight="800" fill="#101b35">Geotagging</text><text x="72" y="410" font-family="Arial,sans-serif" font-size="59" font-weight="800" fill="#101b35">and Geolocation</text>
  <text x="72" y="449" font-family="Arial,sans-serif" font-size="19" fill="#65748b">RFID/NFC scanning records the check-in or check-out,</text><text x="72" y="477" font-family="Arial,sans-serif" font-size="19" fill="#65748b">GPS confirms it happened at the school gate.</text>
  <rect x="72" y="520" width="420" height="64" rx="11" fill="#e7f1ff" stroke="#9ec8ff"/><text x="100" y="548" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#173a70">Location verifies the event; it does not track the child.</text><text x="100" y="572" font-family="Arial,sans-serif" font-size="15" fill="#405677">Coordinates captured only at the moment of a scan.</text>
  <g filter="url(#shadow)"><rect x="600" y="145" width="520" height="470" rx="18" fill="#fff"/><circle cx="640" cy="187" r="19" fill="#e9f1ff"/><text x="632" y="194" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1462ca">AS</text><text x="674" y="184" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202b42">A. Santos</text><text x="674" y="205" font-family="Arial,sans-serif" font-size="13" fill="#718096">Main Gate Entrance</text>
  <path d="M600 228h520M600 336h520M600 444h520M600 552h520" stroke="#e5eaf1"/>
  <circle cx="640" cy="266" r="16" fill="#effbf7" stroke="#3eb78e"/><path d="M634 266l5 5 9-10" fill="none" stroke="#238b69" stroke-width="2"/><text x="674" y="258" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1262bc">SCAN</text><text x="674" y="280" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202b42">RFID/NFC tag read at the gate</text><text x="674" y="301" font-family="Arial,sans-serif" font-size="13" fill="#718096">A. Santos tapped in at Main Gate — 7:42 AM</text>
  <circle cx="640" cy="374" r="16" fill="#effbf7" stroke="#3eb78e"/><path d="M634 374l5 5 9-10" fill="none" stroke="#238b69" stroke-width="2"/><text x="674" y="366" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1262bc">VERIFY</text><text x="674" y="388" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202b42">Location confirmed inside geofence</text><text x="674" y="409" font-family="Arial,sans-serif" font-size="13" fill="#718096">GPS match: within designated school boundary</text>
  <circle cx="640" cy="482" r="16" fill="#edf4ff" stroke="#4387ff"/><text x="636" y="488" font-family="Arial,sans-serif" font-size="15" fill="#1262bc">3</text><text x="674" y="474" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1262bc">RECORD</text><text x="674" y="496" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202b42">Attendance event stored</text><text x="674" y="517" font-family="Arial,sans-serif" font-size="13" fill="#718096">Logged as Checked In — visible to admin and teacher</text></g>
</svg>
